name: LLJ Soundings (radiosonde wind/CAPE)

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-llj-obs]

concurrency:
  group: llj-obs
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-llj-obs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLJ soundings
        env:
          LLJ_OUTPUT_DIR: output/llj_obs
        run: python llj_obs.py

      # ── Reassemble the full Pages site from what's already committed,
      #    so deploying here doesn't wipe out the synoptic map / ua_availability ──
      - name: Prepare Pages output
        run: |
          mkdir -p pages/llj_obs
          [ -f output/synoptic_map.html ] && cp output/synoptic_map.html pages/index.html || true
          [ -f output/ua_availability.html ] && cp output/ua_availability.html pages/ua_availability.html || true
          cp output/llj_obs/index.html pages/llj_obs/index.html
          shopt -s nullglob
          for prefix in winds soundings; do
            files=(output/llj_obs/${prefix}_*.zip)
            [ ${#files[@]} -eq 0 ] && continue
            latest=$(printf '%s\n' "${files[@]}" | sort | tail -n 1)
            cp "$latest" pages/llj_obs/
          done
      # ── Prune the archive: keep the newest 7 zips of each type ──
      - name: Prune old LLJ zips
        run: |
          shopt -s nullglob
          for prefix in winds soundings; do
            files=(output/llj_obs/${prefix}_*.zip)
            n=${#files[@]}
            if [ "$n" -gt 7 ]; then
              printf '%s\n' "${files[@]}" | sort | head -n $((n-7)) | xargs -r rm -f --
            fi
          done

      # ── Commit the LLJ output back to the repo (archive) ──
      - name: Commit output to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/llj_obs
          git diff --cached --quiet || \
            git commit -m "chore: update LLJ soundings $(date -u +'%Y-%m-%d %H%MZ')"
          git fetch origin main
          git push --force-with-lease origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
