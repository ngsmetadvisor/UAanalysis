<script>
var pngData = {};
function openSounding(baseKey) {
    var profileKey = baseKey + "|PROFILE";
    var windsKey = baseKey + "|WINDS";
    var html = '<title>' + baseKey + '</title>';
    var found = false;
    if (pngData[profileKey]) {
        html += '<h3 style="font-family:sans-serif;">Tephigram / CAPE</h3>' +
                '<img src="data:image/png;base64,' + pngData[profileKey] + '" style="max-width:100%;">';
        found = true;
    }
    if (pngData[windsKey]) {
        html += '<h3 style="font-family:sans-serif;">Wind Speed Profile</h3>' +
                '<img src="data:image/png;base64,' + pngData[windsKey] + '" style="max-width:100%;">';
        found = true;
    }
    if (found) {
        var w = window.open("");
        w.document.write(html);
    } else {
        alert("No sounding available for " + baseKey);
    }
}

function _runColumnHtml(stationKey, runLabel) {
    var profileKey = stationKey + "|" + runLabel + "|PROFILE";
    var windsKey = stationKey + "|" + runLabel + "|WINDS";
    var hasAny = false;
    var inner = '<h3 style="font-family:sans-serif;margin:4px 0;">' + runLabel + '</h3>';
    if (pngData[profileKey]) {
        inner += '<div style="font-family:sans-serif;font-size:12px;font-weight:bold;margin-top:6px;">Tephigram / CAPE</div>' +
                 '<img src="data:image/png;base64,' + pngData[profileKey] + '" style="max-width:100%;">';
        hasAny = true;
    }
    if (pngData[windsKey]) {
        inner += '<div style="font-family:sans-serif;font-size:12px;font-weight:bold;margin-top:6px;">Wind Speed Profile</div>' +
                 '<img src="data:image/png;base64,' + pngData[windsKey] + '" style="max-width:100%;">';
        hasAny = true;
    }
    if (!hasAny) {
        inner += '<div style="font-family:sans-serif;font-size:13px;color:#888;padding:20px 0;">Not available</div>';
    }
    return inner;
}

function openSoundingBoth(stationKey) {
    var html = '<title>' + stationKey + '</title>' +
        '<div style="display:flex;flex-direction:row;width:100%;">' +
        '<div style="flex:1;padding:8px;box-sizing:border-box;">' + _runColumnHtml(stationKey, "00Z") + '</div>' +
        '<div style="width:1px;background:#ccc;"></div>' +
        '<div style="flex:1;padding:8px;box-sizing:border-box;">' + _runColumnHtml(stationKey, "12Z") + '</div>' +
        '</div>';
    var w = window.open("");
    w.document.write(html);
}
</script>
